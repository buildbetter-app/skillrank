name: Refresh

# Weekly: re-pin skills whose source repo has advanced past the commit we pinned,
# so `skillrank outdated` / `upgrade` reflect real upstream updates. Cheap — one
# HEAD check per repo, content re-fetched only for skills that actually changed.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Re-pin skills whose source advanced
        env:
          GH_TOKEN: ${{ github.token }}
        run: node registry/ingest/ingest.mjs --refresh

      # A scan tier is derived from CONTENT, and content is deliberately not
      # persisted (the registry is index-only and never rehosts). So a rules bump
      # cannot re-score anything from local state — the pinned bytes have to come
      # back. This re-fetches only the entries whose stored verdict did not come
      # from the current scanner, and needs no token: it reads already-pinned raw
      # URLs. Without it, every tier would freeze at whatever the scanner said
      # the day the skill was first pinned.
      - name: Re-tier anything whose scan predates the current rules
        run: node registry/ingest/rescan.mjs

      # The scanner exists so legitimate skills stop triggering a confirmation
      # prompt. If a rules change quietly reverses that, this fails before the
      # regenerated catalog is committed.
      - name: Fail if the catalog stopped being mostly safe
        working-directory: registry
        run: node --test test/scan-calibration.test.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "skillrank-bot"
          git config user.email "bot@users.noreply.github.com"
          git add registry/data/ingested.json registry/data/enriched.json registry/api/ingested.json registry/api/enriched.json
          if git diff --cached --quiet; then
            echo "no upstream changes"
          else
            git commit -m "chore(catalog): weekly refresh — re-pin updated skills [skip ci]"
            git push
          fi
